[package]
name = "aes-keywrap"
version = "0.9.1"
authors = ["Frank Denis <github@pureftpd.org>"]
edition = "2018"
description = "AES key wrapping and unwrapping with AES-KW (RFC 3394) and AES-KWP (RFC 5649) for encrypting secret keys"
keywords = ["aes", "keywrap", "aes-kw", "aes-kwp", "encryption"]
repository = "https://github.com/jedisct1/rust-aes-keywrap"
homepage = "https://github.com/jedisct1/rust-aes-keywrap"
categories = ["algorithms", "cryptography", "no-std", "wasm"]
license = "MIT"
readme = "README.md"

[dependencies]
aes = "0.9.3"
byteorder = "1.5"
